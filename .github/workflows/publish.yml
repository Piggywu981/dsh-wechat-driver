name: publish

# 打 tag（v0.1.0 / v1.2.3 ...）即发布到 npm；也可手动触发。
# 认证走 npm Trusted Publishing（OIDC），不需要 NPM_TOKEN secret。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC：换取 npm 的短期发布凭据 + provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm (OIDC 需要 >= 11.5.1)
        run: npm install -g npm@latest && npm --version

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "package.json=$PKG_VERSION  tag=$TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 package.json 版本 $PKG_VERSION 不一致"
            exit 1
          fi

      - name: Show what will be packed
        run: npm pack --dry-run

      - name: Publish
        # 不要设 NODE_AUTH_TOKEN：设了会盖掉 OIDC，又回到 2FA 那道墙。
        run: npm publish --access public --provenance
